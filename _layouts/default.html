<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.body_class contains "home" %}{{ site.title }} | {{ site.description }}{% else %}{{ page.title | strip_html }} | {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
{% if page.robots %}<meta name="robots" content="{{ page.robots }}">
{% else %}<link rel="canonical" href="{{ page.url | absolute_url }}">
{% endif %}
{% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wordpress-base.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/media-queries.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/fixes.css' | relative_url }}">
</head>

<body class="{{ page.body_class | default: 'page' }} group-blog">
<div id="page" class="hfeed site">

	{% include header.html %}

	<div id="content" class="site-content">

	<div id="primary" class="content-area">
		<main id="main" class="site-main" role="main">
{{ content }}
		</main><!-- #main -->
	</div><!-- #primary -->

	{% include sidebar.html %}
	</div><!-- #content -->

	{% include footer.html %}
</div><!-- #page -->

<script src="{{ '/assets/js/navigation.js' | relative_url }}"></script>
<script src="{{ '/assets/js/skip-link-focus-fix.js' | relative_url }}"></script>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
