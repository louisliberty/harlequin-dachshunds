<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.body_class contains "home" %}{{ site.title }} | {{ site.description }}{% else %}{{ page.title | strip_html }} | {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
{% if page.robots %}<meta name="robots" content="{{ page.robots }}">
{% else %}<link rel="canonical" href="{{ page.url | absolute_url }}">
{% endif %}
{% include social-and-schema.html %}
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400&family=Lora:wght@500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
</head>

<body class="{{ page.body_class | default: 'page' }} group-blog">
<div id="page" class="hfeed site">

	{% include header.html %}

	<div id="content" class="site-content">

	<div id="primary" class="content-area">
		<main id="main" class="site-main" role="main">
{{ content }}
		</main><!-- #main -->
	</div><!-- #primary -->

	</div><!-- #content -->

	{% include footer.html %}
</div><!-- #page -->

<script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}"></script>
</body>
</html>
