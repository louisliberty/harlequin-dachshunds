---
layout: default
---
<article class="post type-post status-publish format-standard hentry{% for cat in page.categories %} category-{{ cat }}{% endfor %}">
	<header class="entry-header">
		<h1 class="entry-title">{{ page.title }}</h1>

		<div class="entry-meta">
		</div><!-- .entry-meta -->
	</header><!-- .entry-header -->

	<div class="entry-content">
{{ content }}
	</div><!-- .entry-content -->

	<footer class="entry-footer">
		Posted in: {% for cat in page.categories %}<a href="{{ site.data.categories[cat].url | relative_url }}" rel="category tag">{{ site.data.categories[cat].title | default: cat }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}
	</footer><!-- .entry-footer -->
</article><!-- #post-## -->

{% include comments.html %}
