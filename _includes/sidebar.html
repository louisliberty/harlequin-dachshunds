	<div id="secondary" class="widget-area" role="complementary">
		<aside id="text-2" class="widget widget_text"><h1 class="widget-title">Contact</h1>
			<div class="textwidget">Email: <a href="mailto:{{ site.email }}">{{ site.email }}</a>
<p>We'd love to hear from you!</p></div>
		</aside>

		<aside id="rpjc_widget_cat_recent_posts-2" class="widget rpjc_widget_cat_recent_posts widget_recent_entries"><h1 class="widget-title"><a href="{{ '/category/blog/' | relative_url }}" class="lighten">Read Our Blog!</a></h1><ul>
		{% for post in site.categories.blog %}<li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>{% endfor %}
		</ul></aside>

		<aside id="search-2" class="widget widget_search"><form role="search" method="get" class="search-form" action="https://duckduckgo.com/">
	<label>
		<span class="screen-reader-text">Search for:</span>
		<input type="search" class="search-field" placeholder="Search …" value="" name="q" title="Search for:" />
	</label>
	<input type="hidden" name="sites" value="harlequindachshunds.com" />
	<input type="submit" class="search-submit" value="Search" />
</form></aside>

		<aside id="text-3" class="widget widget_text"><h1 class="widget-title">Harlequin Dachshunds</h1>
			<div class="textwidget"><p><a href="{{ '/category/agility/' | relative_url }}"><img src="{{ '/assets/images/site/sidebar-agility.jpg' | relative_url }}" alt="dachshund" /></a></p>
<p><a href="{{ '/puppies/' | relative_url }}"><img src="{{ '/assets/images/site/sidebar-puppy.jpg' | relative_url }}" alt="puppy" /></a></p>
</div>
		</aside>

		<aside id="text-4" class="widget widget_text"><h1 class="widget-title">Links</h1>
			<div class="textwidget"><p>{% for link in site.data.links %}<a href="{{ link.url }}">{{ link.title }}</a>{% unless forloop.last %}<br />{% endunless %}{% endfor %}</p></div>
		</aside>
	</div><!-- #secondary -->
