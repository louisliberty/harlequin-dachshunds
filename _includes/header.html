	<header id="masthead" class="site-header" role="banner">
		<div class="site-branding">
			<a class="site-logo" href="{{ '/' | relative_url }}" rel="home"><picture><source type="image/webp" srcset="/assets/images/site/logo-header-144.webp 1x, /assets/images/site/logo-header-216.webp 1.5x, /assets/images/site/logo-header-216.webp 2x"><img src="/assets/images/site/logo-header-144.png" alt="Harlequin Dachshunds, miniature longhaired dachshunds" width="460" height="144" fetchpriority="high"></picture></a>
		</div>

		<nav id="site-navigation" class="main-navigation" role="navigation">
			<div class="menu-toggle"><a href="#toggle">Menu</a></div>

			<div class="menu-primary-container"><ul id="menu-primary" class="menu">

			{% endfor %}</ul></div>
		</nav><!-- #site-navigation -->
	</header><!-- #masthead -->
