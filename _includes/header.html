	<header id="masthead" class="site-header" role="banner">
		<div class="site-branding">
			<a href="{{ '/' | relative_url }}" title="{{ site.title }}" rel="home">{% include picture.html src="/assets/images/site/header.jpg" alt=site.title width="1000" height="122" sizes="(max-width: 1000px) 100vw, 1000px" %}</a>
		</div>

		<nav id="site-navigation" class="main-navigation" role="navigation">
			<div class="menu-toggle"><a href="#toggle">Menu</a></div>
			<a class="skip-link screen-reader-text" href="#content">Skip to content</a>

			<div class="menu-primary-container"><ul id="menu-primary" class="menu">
			{% for item in site.data.navigation %}<li class="menu-item{% if page.url == item.url %} current-menu-item{% endif %}"><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
			{% endfor %}</ul></div>
		</nav><!-- #site-navigation -->
	</header><!-- #masthead -->
